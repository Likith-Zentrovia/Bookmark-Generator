[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "bookmark-generator"
version = "0.1.0"
description = "Extract and reconstruct chapter structure from PDFs without bookmarks"
requires-python = ">=3.9"
dependencies = [
    "PyMuPDF>=1.23.0",
    "rapidfuzz>=3.0.0",
]

[project.optional-dependencies]
llm = [
    "anthropic>=0.20.0",
]
dev = [
    "pytest>=7.0",
]

[project.scripts]
bookmark-generator = "bookmark_generator.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
